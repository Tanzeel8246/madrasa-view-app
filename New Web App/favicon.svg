  <!-- Mosque body -->
  <rect x="20" y="26" width="24" height="18" fill="#284D3D"/>

  <!-- Door arch -->
  <path d="M28 44 Q28 36 32 36 Q36 36 36 44 Z" fill="#ffffff"/>

  <!-- Left minaret -->
  <rect x="12" y="22" width="6" height="22" rx="1" fill="#284D3D"/>
