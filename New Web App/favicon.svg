<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- White background -->
  <rect width="64" height="64" rx="10" fill="#ffffff"/>

  <!-- Mosque dome (main) -->
