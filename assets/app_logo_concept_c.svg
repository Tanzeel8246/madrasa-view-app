<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Midnight Obsidian Emerald Background -->
    <radialGradient id="bgC" cx="50%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#0e3a2b" />
      <stop offset="50%" stop-color="#051912" />
      <stop offset="100%" stop-color="#010704" />
    </radialGradient>

    <!-- Imperial Platinum Gold -->
    <linearGradient id="goldC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Left Wing Gradient: Radiant Emerald to Mint -->
    <linearGradient id="wingGradC1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Right Wing Gradient: Turquoise to Royal Cyan -->
    <linearGradient id="wingGradC2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <filter id="glowC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgC)" stroke="url(#goldC)" stroke-width="5" />
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Radiating Geometrical Arch Lines in Background -->
  <g stroke="rgba(245, 158, 11, 0.15)" stroke-width="1.2" fill="none">
    <circle cx="256" cy="210" r="140" stroke-dasharray="4,6" />
    <path d="M 140 320 Q 140 120 256 90 Q 372 120 372 320" />
    <path d="M 160 320 Q 160 145 256 120 Q 352 145 352 320" stroke="rgba(16, 185, 129, 0.2)" />
  </g>

  <!-- ============================================================ -->
  <!-- REGAL WINGS OF WISDOM & SACRED ARCH CREST                    -->
  <!-- ============================================================ -->
  <g id="regal-wings-emblem" transform="translate(0, -10)">

    <!-- Top Crown: 8-Point Rub-el-Hizb Star in Radiant Gold -->
    <g transform="translate(256, 75)" filter="url(#glowC)">
      <polygon points="0,-16 5,-5 16,0 5,5 0,16 -5,5 -16,0 -5,-5" fill="url(#goldC)" />
      <polygon points="0,-16 5,-5 16,0 5,5 0,16 -5,5 -16,0 -5,-5" fill="url(#goldC)" transform="rotate(45)" opacity="0.8" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>

    <!-- LEFT SWEEPING WING (پرِ حکمت - بایاں بازو) -->
    <g>
      <!-- Outer Primary Feather/Page -->
      <path d="M 256 145 C 220 125 150 145 110 215 C 135 210 175 220 256 265 Z" 
            fill="url(#wingGradC1)" stroke="url(#goldC)" stroke-width="2" />
      <!-- Middle Secondary Feather/Page -->
      <path d="M 256 185 C 215 175 145 200 120 255 C 150 250 195 258 256 295 Z" 
            fill="#ffffff" stroke="url(#goldC)" stroke-width="1.8" opacity="0.95" />
      <!-- Inner Base Feather -->
      <path d="M 256 225 C 225 215 165 240 145 290 C 175 285 215 292 256 315 Z" 
            fill="#059669" stroke="url(#goldC)" stroke-width="1.5" />
      <!-- Golden Quill Inscriptions -->
      <line x1="160" y1="185" x2="225" y2="235" stroke="url(#goldC)" stroke-width="2" stroke-linecap="round" />
      <line x1="150" y1="230" x2="210" y2="268" stroke="#059669" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- RIGHT SWEEPING WING (پرِ حکمت - دایاں بازو) -->
    <g>
      <!-- Outer Primary Feather/Page -->
      <path d="M 256 145 C 292 125 362 145 402 215 C 377 210 337 220 256 265 Z" 
            fill="url(#wingGradC2)" stroke="url(#goldC)" stroke-width="2" />
      <!-- Middle Secondary Feather/Page -->
      <path d="M 256 185 C 297 175 367 200 392 255 C 362 250 317 258 256 295 Z" 
            fill="#f0f9ff" stroke="url(#goldC)" stroke-width="1.8" opacity="0.95" />
      <!-- Inner Base Feather -->
      <path d="M 256 225 C 287 215 347 240 367 290 C 337 285 297 292 256 315 Z" 
            fill="#0284c7" stroke="url(#goldC)" stroke-width="1.5" />
      <!-- Golden Quill Inscriptions -->
      <line x1="352" y1="185" x2="287" y2="235" stroke="url(#goldC)" stroke-width="2" stroke-linecap="round" />
      <line x1="362" y1="230" x2="302" y2="268" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- CENTER PINNACLE & MIHRAB HEART (مرکزی ستونِ نور) -->
    <path d="M 256 115 L 268 185 L 256 325 L 244 185 Z" fill="url(#goldC)" />
    <circle cx="256" cy="185" r="9" fill="#ffffff" stroke="url(#goldC)" stroke-width="2.5" filter="url(#glowC)" />

    <!-- Royal Base Pedestal Stand -->
    <path d="M 215 305 L 180 340 L 205 345 L 245 315 Z" fill="#92400e" stroke="url(#goldC)" stroke-width="1.5" />
    <path d="M 297 305 L 332 340 L 307 345 L 267 315 Z" fill="#b45309" stroke="url(#goldC)" stroke-width="1.5" />
    <circle cx="256" cy="318" r="5" fill="#fef08a" />
  </g>

  <!-- Typography Banner -->
  <g transform="translate(0, 362)">
    <rect x="76" y="0" width="360" height="56" rx="28" fill="rgba(6, 24, 18, 0.9)" stroke="url(#goldC)" stroke-width="2" />
    <text x="256" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="4" fill="url(#goldC)">
      MC-MMS
    </text>
    <text x="256" y="78" text-anchor="middle" font-family="'Noto Nastaliq Urdu', 'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#38bdf8">
      بائے مائنڈ کرافٹس اے آئی (Cloud ERP)
    </text>
    <text x="256" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#94a3b8">
      NEXT-GEN MADRASA &amp; MASJID SYSTEM
    </text>
  </g>
</svg>
